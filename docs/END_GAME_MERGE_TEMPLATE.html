<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SKIELSEN · Canonical End Tables</title>

<!--
  SKIELSEN · CANONICAL END TABLE / MERGE TEMPLATE
  Version: 2.0
  Updated: 2026-09-25
  Reference implementation: DNA standalone

  LOCKED DESIGN / FLOW
  ====================
  1. Game ranking table:
     - rounded Skielsen card
     - vertical team-colour accent
     - placement points: +5 / +4 / +2 / +0
     - no "PTS" suffix
     - placement bonuses appear bottom -> top
     - table remains unchanged for 2 seconds before bonuses appear

  2. Transition to tournament table:
     - button text: WEITER ZUR TURNIERTABELLE →
     - same visible rows persist; do not blank/re-render the table
     - game metric heading becomes PUNKTE
     - former placement column initially has no heading
     - placement +X values remain visible

  3. Point merge:
     - one row at a time, bottom -> top
     - +X travels toward the old tournament score
     - +X stops beside the old score, never overlaps its glyphs
     - +X fully fades
     - only then old score becomes final summed score
     - summed score pulses once

  4. Reorder:
     - BEWEGUNG heading appears only after all point merges
     - movement cells remain empty during the swap
     - rows physically travel to their new slots
     - DOM order changes only after visual arrival
     - movement values appear after the swap

  5. Celebration:
     - confetti starts last
     - winner team colour
     - several waves over time, not one dense burst

  6. Canonical lifecycle:
     RANKING -> optional JOKER_RESOLUTION -> MERGE -> CLOSE

  Motion baseline:
     MOTION_SCALE = 3.0625

  Animation detail reference:
     docs/style/SKIELSEN_ANIMATION_STYLE_TEMPLATE_v1.md
-->

<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&display=swap');

:root{
  --page:#e9e9e9;
  --surface:#fff;
  --soft:#f6f6f6;
  --text:#050505;
  --muted:#777;
  --border:#ddd;
  --purple:rgb(124,92,255);
  --success:#18a957;
  --danger:#e24545;

  --blue:#1515ff;
  --red:#ff1717;
  --yellow:#f2b705;
  --green:#00a65a;

  --ui:"Archivo",sans-serif;
}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  min-height:100vh;
  background:var(--page);
  color:var(--text);
  font-family:var(--ui);
  padding:24px 16px 60px;
}

.demo{
  width:min(680px,100%);
  margin:0 auto;
}

.hero{margin:0 0 18px}
.hero small{
  display:block;
  margin-bottom:7px;
  color:#686868;
  font-size:10px;
  font-weight:900;
  letter-spacing:.15em;
}
.hero h1{
  margin:0;
  font-size:clamp(56px,14vw,104px);
  line-height:.82;
  letter-spacing:-.065em;
  font-weight:900;
}

.card{
  overflow:hidden;
  border:1px solid var(--border);
  border-radius:24px;
  background:var(--surface);
}

.card>header{
  min-height:86px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  border-bottom:1px solid var(--border);
}
.card>header strong{
  font-size:15px;
  font-weight:900;
}
.card>header span{
  color:var(--muted);
  font-size:9px;
  font-weight:800;
  text-align:right;
}

.columns,
.row{
  display:grid;
  grid-template-columns:62px minmax(0,1fr) 92px 94px;
  align-items:center;
  gap:10px;
  padding:0 14px;
}
.columns{
  min-height:58px;
  background:var(--soft);
  color:var(--muted);
  font-size:8px;
  font-weight:900;
  letter-spacing:.03em;
}
.columns span:nth-child(3),
.columns span:nth-child(4){text-align:right}

.rows{position:relative}
.row{
  min-height:100px;
  border-top:1px solid var(--border);
  background:var(--surface);
  will-change:transform;
}
.row:first-child{border-top:0}

.place{
  font-size:18px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}

.team{
  min-width:0;
  display:grid;
  grid-template-columns:7px minmax(0,1fr);
  align-items:center;
  gap:12px;
}
.team-accent{
  width:7px;
  height:52px;
  border-radius:99px;
  background:var(--team);
}
.team-copy{min-width:0}
.team-copy strong{
  display:block;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  font-size:14px;
  font-weight:900;
}
.team-copy small{
  display:block;
  margin-top:5px;
  color:var(--muted);
  font-size:8px;
  font-weight:700;
}

.metric,
.points-stack{
  justify-self:end;
  font-size:22px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
.points-stack{
  position:relative;
  display:grid;
  justify-items:end;
  min-width:42px;
}
.old-points,.final-points{grid-area:1/1}
.final-points{opacity:0;visibility:hidden}

.stage{
  min-width:70px;
  display:flex;
  justify-content:flex-end;
  align-items:center;
  position:relative;
}
.bonus{
  color:var(--purple);
  font-size:20px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .42s ease,transform .42s ease;
}
.row.bonus-visible .bonus{
  opacity:1;
  transform:none;
}
.movement{
  position:absolute;
  right:0;
  opacity:0;
  transform:translateY(4px);
  font-size:13px;
  font-weight:900;
  transition:opacity .39s ease,transform .39s ease;
}
.movement.visible{opacity:1;transform:none}
.movement.up{color:var(--success)}
.movement.down{color:var(--danger)}
.movement.same{color:var(--muted)}

.row.summed .old-points{opacity:0;visibility:hidden}
.row.summed .final-points{opacity:1;visibility:visible}
.row.summed .bonus{opacity:0}

.row.arrived .final-points{
  animation:pointPulse .48s cubic-bezier(.2,.8,.2,1);
}
@keyframes pointPulse{
  0%{transform:scale(1)}
  45%{transform:scale(1.18)}
  100%{transform:scale(1)}
}

.actions{margin-top:22px}
button{
  width:100%;
  min-height:68px;
  border:0;
  border-radius:18px;
  background:#050505;
  color:#fff;
  font:900 12px/1 var(--ui);
  letter-spacing:.02em;
  cursor:pointer;
}
button:disabled{opacity:.45;cursor:default}

.confetti{
  position:fixed;
  inset:0;
  pointer-events:none;
  overflow:hidden;
  z-index:99;
}
.confetti i{
  position:absolute;
  top:-20px;
  width:9px;
  height:18px;
  border-radius:2px;
  background:var(--team);
  animation:fall var(--dur) var(--wait) linear forwards;
}
@keyframes fall{
  from{transform:translate3d(0,-20px,0) rotate(0);opacity:1}
  to{transform:translate3d(var(--drift),105vh,0) rotate(680deg);opacity:.15}
}

.note{
  margin-top:18px;
  padding:15px 16px;
  border:1px solid var(--border);
  border-radius:16px;
  background:rgba(255,255,255,.65);
  color:#555;
  font-size:10px;
  font-weight:700;
  line-height:1.45;
}

@media(max-width:720px){
  body{padding:16px 12px 48px}
  .hero{margin-bottom:14px}
  .hero h1{font-size:clamp(58px,18vw,84px)}
  .card{border-radius:18px}
  .card>header{min-height:62px;padding:0 14px}
  .card>header strong{font-size:12px}
  .card>header span{font-size:7px}
  .columns,.row{
    grid-template-columns:42px minmax(0,1fr) 68px 66px;
    gap:7px;
    padding:0 10px;
  }
  .columns{min-height:46px;font-size:6px}
  .row{min-height:78px}
  .place{font-size:14px}
  .team{grid-template-columns:5px minmax(0,1fr);gap:9px}
  .team-accent{width:5px;height:40px}
  .team-copy strong{font-size:10px}
  .team-copy small{font-size:6px;margin-top:4px}
  .metric,.points-stack{font-size:17px}
  .bonus{font-size:15px}
  .movement{font-size:10px}
  button{min-height:56px;border-radius:15px;font-size:9px}
}
</style>
</head>

<body>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<main class="demo">
  <section class="hero">
    <small id="kicker">GAME RANKING</small>
    <h1 id="heroTitle">ERGEBNIS.</h1>
  </section>

  <section class="card" id="table">
    <header>
      <strong id="tableTitle">GAME · FINALES ERGEBNIS</strong>
      <span id="tableMeta">HÖHER IST BESSER</span>
    </header>

    <div class="columns">
      <span>POSITION</span>
      <span>TEAM</span>
      <span id="metricHeading">GAME</span>
      <span id="movementHeading"></span>
    </div>

    <div class="rows" id="rows"></div>
  </section>

  <div class="actions">
    <button id="action" type="button">WEITER ZUR TURNIERTABELLE →</button>
  </div>

  <div class="note">
    Kanonische Referenz: Die Ergebnis-Tabelle bleibt beim Merge dasselbe sichtbare Objekt.
    Keine leere Zwischenansicht, kein zweites Row-Appear und kein Teleport-Reorder.
  </div>
</main>

<script>
const MOTION_SCALE=3.0625;
const motionMs=ms=>Math.round(ms*MOTION_SCALE);

const TEAMS={
  RED:{name:'TEAM ROT',members:'DJEELOI + SOFYA',color:'#ff1717',existing:12},
  BLUE:{name:'TEAM BLAU',members:'HANNES + PIA',color:'#1515ff',existing:11},
  YELLOW:{name:'TEAM GELB',members:'TOM + ANNA',color:'#f2b705',existing:7},
  GREEN:{name:'TEAM GRÜN',members:'MATS + LENA',color:'#00a65a',existing:9}
};

const STABLE_ORDER=['BLUE','RED','YELLOW','GREEN'];

const gameRows=[
  {key:'RED',score:24},
  {key:'YELLOW',score:18},
  {key:'BLUE',score:12},
  {key:'GREEN',score:8}
]
.sort((a,b)=>b.score-a.score||STABLE_ORDER.indexOf(a.key)-STABLE_ORDER.indexOf(b.key))
.map((r,i)=>({...r,place:i+1,bonus:[5,4,2,0][i]}));

const rowsHost=document.querySelector('#rows');
const action=document.querySelector('#action');
const heroTitle=document.querySelector('#heroTitle');
const kicker=document.querySelector('#kicker');
const tableTitle=document.querySelector('#tableTitle');
const tableMeta=document.querySelector('#tableMeta');
const metricHeading=document.querySelector('#metricHeading');
const movementHeading=document.querySelector('#movementHeading');
const confettiHost=document.querySelector('#confetti');

let state='RESULT';
let timers=[];

function later(fn,ms){
  const id=setTimeout(fn,ms);
  timers.push(id);
  return id;
}

function rowMarkup(r,i){
  const t=TEAMS[r.key];
  return `<div class="row" data-team="${r.key}">
    <b class="place">${String(r.place).padStart(2,'0')}</b>
    <span class="team" style="--team:${t.color}">
      <i class="team-accent"></i>
      <span class="team-copy">
        <strong>${t.name}</strong>
        <small>${t.members}</small>
      </span>
    </span>
    <b class="metric">${r.score}</b>
    <span class="stage"><b class="bonus">+${r.bonus}</b></span>
  </div>`;
}

function renderResult(){
  state='RESULT';
  rowsHost.innerHTML=gameRows.map(rowMarkup).join('');
  [...rowsHost.children].forEach((row,i)=>{
    row.style.opacity='0';
    row.style.transform='translateY(7px)';
    later(()=>{
      row.style.transition='opacity .63s ease, transform .63s ease';
      row.style.opacity='1';
      row.style.transform='none';
    },motionMs(160+i*130));
  });

  // Hold unchanged for 2 seconds, then placement points bottom -> top.
  later(()=>{
    [...rowsHost.children].reverse().forEach((row,i)=>{
      later(()=>row.classList.add('bonus-visible'),motionMs(i*260));
    });
  },2000);
}

function beginMerge(){
  if(state!=='RESULT')return;
  state='MERGE';
  action.disabled=true;
  action.textContent='MERGE LÄUFT …';

  kicker.textContent='END GAME MERGE';
  heroTitle.textContent='PUNKTE.';
  tableTitle.textContent='TURNIERSTAND';
  tableMeta.textContent='GAME → TURNIERPUNKTE';
  metricHeading.textContent='PUNKTE';
  movementHeading.textContent='';

  const oldOrder=Object.entries(TEAMS)
    .map(([key,t],i)=>({key,points:t.existing,stable:STABLE_ORDER.indexOf(key)}))
    .sort((a,b)=>b.points-a.points||a.stable-b.stable);
  const oldPos=Object.fromEntries(oldOrder.map((r,i)=>[r.key,i+1]));
  const bonusByTeam=Object.fromEntries(gameRows.map(r=>[r.key,r.bonus]));

  const data=Object.fromEntries(Object.entries(TEAMS).map(([key,t])=>[
    key,
    {
      key,
      old:t.existing,
      add:bonusByTeam[key]||0,
      final:t.existing+(bonusByTeam[key]||0),
      stable:STABLE_ORDER.indexOf(key)
    }
  ]));

  [...rowsHost.children].forEach(row=>{
    const d=data[row.dataset.team];
    const metric=row.querySelector('.metric');
    const stage=row.querySelector('.stage');

    const stack=document.createElement('span');
    stack.className='points-stack';
    stack.innerHTML=`<b class="old-points">${d.old}</b><b class="final-points">${d.final}</b>`;
    metric.replaceWith(stack);

    const bonus=stage.querySelector('.bonus');
    bonus.textContent='+'+d.add;
    const move=document.createElement('b');
    move.className='movement';
    stage.appendChild(move);
  });

  const finalRows=Object.values(data)
    .sort((a,b)=>b.final-a.final||a.stable-b.stable)
    .map((r,i)=>({...r,after:i+1}));

  later(()=>mergePoints(finalRows,oldPos),motionMs(420));
}

async function wait(ms){
  return new Promise(resolve=>later(resolve,ms));
}

async function mergePoints(finalRows,oldPos){
  const rows=[...rowsHost.children];

  // Sequential, bottom -> top.
  for(const row of [...rows].reverse()){
    const bonus=row.querySelector('.bonus');
    const old=row.querySelector('.old-points');
    const br=bonus.getBoundingClientRect();
    const or=old.getBoundingClientRect();

    // Collision guard: stop 8px right of existing score.
    const dx=(or.right+8)-br.left;

    const anim=bonus.animate([
      {transform:'translate3d(0,0,0)',opacity:1,offset:0},
      {transform:`translate3d(${dx*.9}px,0,0)`,opacity:1,offset:.72},
      {transform:`translate3d(${dx}px,0,0)`,opacity:.28,offset:.9},
      {transform:`translate3d(${dx}px,0,0)`,opacity:0,offset:1}
    ],{
      duration:motionMs(240),
      easing:'cubic-bezier(.2,.8,.2,1)',
      fill:'forwards'
    });

    await anim.finished.catch(()=>{});
    anim.cancel();
    bonus.style.opacity='0';

    row.classList.add('summed','arrived');
    await wait(motionMs(100));
  }

  await wait(motionMs(180));
  movementHeading.textContent='BEWEGUNG';
  await wait(motionMs(220));
  reorderRows(finalRows,oldPos);
}

function reorderRows(finalRows,oldPos){
  const current=[...rowsHost.children];
  const rowByTeam=Object.fromEntries(current.map(r=>[r.dataset.team,r]));
  const slotTops=current.map(r=>r.getBoundingClientRect().top);
  const animations=[];

  finalRows.forEach((r,targetIndex)=>{
    const el=rowByTeam[r.key];
    const dy=slotTops[targetIndex]-el.getBoundingClientRect().top;
    el.classList.add('swapping');

    const anim=el.animate([
      {transform:'translate3d(0,0,0)'},
      {transform:`translate3d(0,${dy}px,0)`}
    ],{
      duration:motionMs(580),
      easing:'cubic-bezier(.2,.72,.18,1)',
      fill:'forwards'
    });
    animations.push({el,anim});
  });

  Promise.all(animations.map(x=>x.anim.finished.catch(()=>{}))).then(()=>{
    animations.forEach(({anim})=>{
      try{anim.commitStyles()}catch(_){}
      anim.cancel();
    });

    finalRows.forEach((r,i)=>{
      const el=rowByTeam[r.key];
      rowsHost.appendChild(el);
      el.querySelector('.place').textContent=String(i+1).padStart(2,'0');
    });

    animations.forEach(({el})=>{
      el.style.transform='none';
      el.classList.remove('swapping');
    });

    later(()=>{
      finalRows.forEach(r=>{
        const el=rowByTeam[r.key];
        const movement=el.querySelector('.movement');
        const delta=(oldPos[r.key]||r.after)-r.after;

        movement.textContent=delta>0?`↑ ${delta}`:delta<0?`↓ ${Math.abs(delta)}`:'—';
        movement.className='movement '+(delta>0?'up':delta<0?'down':'same');
        requestAnimationFrame(()=>movement.classList.add('visible'));
      });

      later(()=>{
        confetti(finalRows[0]?.key);
        action.disabled=false;
        action.textContent='SPIEL SCHLIESSEN →';
      },motionMs(420));
    },motionMs(120));
  });
}

function confetti(key){
  if(!key)return;
  const waves=6;
  const piecesPerWave=18;
  const waveGap=560;

  for(let wave=0;wave<waves;wave++){
    later(()=>{
      for(let i=0;i<piecesPerWave;i++){
        const el=document.createElement('i');
        el.style.setProperty('--team',TEAMS[key].color);
        el.style.left=(Math.random()*100)+'%';
        el.style.setProperty('--dur',(2.15+Math.random()*1.15)+'s');
        el.style.setProperty('--wait',(Math.random()*.24)+'s');
        el.style.setProperty('--drift',(-95+Math.random()*190)+'px');
        confettiHost.appendChild(el);
      }
    },wave*waveGap);
  }

  later(()=>{confettiHost.innerHTML=''},waves*waveGap+3800);
}

action.addEventListener('click',()=>{
  if(state==='RESULT')beginMerge();
});

renderResult();
</script>
</body>
</html>
