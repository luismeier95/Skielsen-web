<!doctype html>
<html lang="de" data-theme-pack="theme.skielsen.core">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e9e9e9">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SKIELSEN · Mehr oder Weniger · Contract Test</title>
<link rel="stylesheet" href="assets/css/app.css?v=15.1.65">
<link rel="stylesheet" href="assets/css/tournament-theme-runtime.css?v=core2fix1">
<link rel="stylesheet" href="assets/css/game-design-contract.css?v=1.0">
<link rel="stylesheet" href="assets/css/more-or-less-contract-test.css?v=15.1.65">
<style id="molcWrongGuard">
.molc-wrong-flag{display:none!important}
.molc-compare-reveal{
  border:2px solid var(--theme-danger)!important;
  background:color-mix(in srgb,var(--theme-danger) 8%,var(--theme-surface))!important;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--theme-danger) 18%,transparent),var(--theme-shadow-soft)!important
}
.molc-compare-reveal .molc-compare-half{background:transparent!important}
</style>
</head>
<body class="v15-tournament-active molc-body" data-theme-pack="theme.skielsen.core">
<nav class="molc-testbar" aria-label="Standalone Test Controls">
  <div><strong>MEHR ODER WENIGER</strong><span>DESIGN CONTRACT TEST</span></div>
  <label>THEME
    <select id="molcTheme">
      <option value="theme.skielsen.core">SKIELSEN CORE</option>
      <option value="theme.skielsen.core2">SKIELSEN CORE 2</option>
      <option value="theme.jga.night">JGA NIGHTS</option>
      <option value="theme.christmas.winter_clash">WINTER CLASH</option>
      <option value="theme.summer.sunset_showdown">SUNSET SHOWDOWN</option>
      <option value="theme.girly.pink_chaos">PINK CHAOS</option>
    </select>
  </label>
  <button type="button" id="molcReset">RESET</button>
</nav>

<main class="molc-stage">
  <section class="skg-shell molc-shell" id="molcApp">
    <header class="skg-header">
      <div class="skg-header-brand">
        <img src="assets/images/skielsen-logo.png" alt="SKIELSEN">
        <span>MEHR ODER WENIGER</span>
      </div>
      <div class="skg-header-right">
        <div class="skg-header-meta">
          <b id="molcMetaStrong">SETUP</b>
          <span id="molcMetaSmall">5 KATEGORIEN</span>
        </div>
        <button class="skg-icon-btn" type="button" id="molcMinimize" aria-label="Minimieren">⌄</button>
      </div>
    </header>

    <div class="skg-progress" aria-hidden="true"><i id="molcProgress"></i></div>
    <main class="skg-content" id="molcContent"></main>
  </section>
</main>

<script src="assets/js/more-or-less-contract-test.js?v=15.1.65"></script>
<script id="molcWrongGuardScript">
(()=>{
  const clean=()=>{
    document.querySelectorAll('.molc-wrong-flag').forEach(el=>el.remove());
    document.querySelectorAll('.molc-compare-reveal').forEach(el=>{
      el.style.setProperty('border','2px solid var(--theme-danger)','important');
      el.style.setProperty('background','color-mix(in srgb,var(--theme-danger) 8%,var(--theme-surface))','important');
    });
  };
  clean();
  new MutationObserver(clean).observe(document.getElementById('molcContent')||document.body,{childList:true,subtree:true});
})();
</script>
</body>
</html>
