<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eaf3ff">
<title>SKIELSEN · TEST DESIGN A</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#eaf3ff}
  #skielsenDesignAFrame{display:block;width:100%;height:100dvh;border:0;background:#eaf3ff}
  #designALoading{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:linear-gradient(145deg,#f7fbff,#dbeafa 55%,#eef6ff);
    color:#07152e;font:900 11px/1.2 Arial,sans-serif;letter-spacing:.12em;
    transition:opacity .2s ease;
  }
  #designALoading[hidden]{display:none}
</style>
</head>
<body>
<div id="designALoading">SKIELSEN · DESIGN A WIRD GELADEN</div>
<iframe
  id="skielsenDesignAFrame"
  title="SKIELSEN Testvollversion Design A"
  src="../index.html?skielsenDesignA=ice-architectural-glass"
  allow="fullscreen; clipboard-read; clipboard-write"
></iframe>
<script>
(()=>{
  const frame=document.getElementById('skielsenDesignAFrame');
  const loading=document.getElementById('designALoading');
  const cssUrl=new URL('design-a.css',location.href).href;

  function applyDesign(){
    try{
      const doc=frame.contentDocument;
      if(!doc)return;
      doc.documentElement.setAttribute('data-skielsen-design-a','ice');
      if(doc.body)doc.body.classList.add('design-a-test');

      let link=doc.getElementById('skielsen-design-a-css');
      if(!link){
        link=doc.createElement('link');
        link.id='skielsen-design-a-css';
        link.rel='stylesheet';
        link.href=cssUrl+'?v=1';
        doc.head.appendChild(link);
      }
      link.addEventListener('load',()=>{loading.hidden=true},{once:true});
      setTimeout(()=>{loading.hidden=true},700);
    }catch(err){
      console.error('Design A injection failed',err);
      loading.textContent='DESIGN A KONNTE NICHT GELADEN WERDEN';
    }
  }

  frame.addEventListener('load',applyDesign);
})();
</script>
</body>
</html>
