<!doctype html>
<html lang="de" data-theme-pack="theme.skielsen.core">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#e9e9e9">
<meta name="mobile-web-app-capable" content="yes">
<title>SKIELSEN · DNA · Standalone</title>
<link rel="stylesheet" href="./style.css?v=2.25.0">
</head>
<body class="dna-body" data-theme-pack="theme.skielsen.core">
<section class="dna-shell" id="dnaApp">
  <header class="dna-header">
    <div class="dna-header-left">
      <img class="dna-header-logo" src="../assets/images/skielsen-logo.png" alt="SKIELSEN">
      <strong class="dna-game-name">DNA</strong>
      <label class="dna-theme-qa" for="dnaThemeSelect">
        <span>THEME QA</span>
        <select id="dnaThemeSelect" aria-label="DNA Theme Contract Test" disabled>
          <option value="theme.skielsen.core">SKIELSEN CORE</option>
        </select>
      </label>
    </div>
    <div class="dna-header-meta">
      <b id="dnaHeaderState">SETUP</b>
    </div>
  </header>
  <div class="dna-progress" aria-label="Spielfortschritt"><i id="dnaProgress"></i></div>
  <main class="dna-content" id="dnaContent" aria-live="polite"></main>
</section>
<script src="../assets/js/00-theme-contract.js?v=2.25.0"></script>
<script src="./app.js?v=2.25.0"></script>
</body>
</html>
