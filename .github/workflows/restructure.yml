name: One-time SKIELSEN repository migration

on:
  push:
    branches:
      - main
    paths:
      - 'migration/v15_0_35_to_36.patch'
      - 'tools/migrate_v15_0_36.py'
      - '.github/workflows/restructure.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: skielsen-restructure
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Ausgangsstand prüfen
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "0b0492145e8323c725d068b84a141cd0a8159b0e"

      - name: V15.0.36 Patch anwenden
        shell: bash
        run: |
          set -euo pipefail
          printf '\n' >> migration/v15_0_35_to_36.patch
          git apply --binary migration/v15_0_35_to_36.patch
          test "$(git hash-object index.html)" = "53fb921f2a8d541d3ef192917fbb2c6b689e3219"

      - name: Monolith in modulare Static-App migrieren
        run: python3 tools/migrate_v15_0_36.py

      - name: Einmalige Migrationsdateien und alte Root-Dateien entfernen
        shell: bash
        run: |
          set -euo pipefail
          rm -f index.html download .nojekyll
          rm -f migration/v15_0_35_to_36.patch
          rmdir migration 2>/dev/null || true
          rm -f tools/migrate_v15_0_36.py
          rm -f .github/workflows/restructure.yml

      - name: Static build prüfen
        run: python3 tools/validate_static.py

      - name: JavaScript Syntax prüfen
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find public/assets/js -type f -name '*.js' -print0)

      - name: Modularen Repo-Stand committen
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restructure SKIELSEN for modular static deployment"
          git push origin HEAD:main

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Public-Verzeichnis hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
