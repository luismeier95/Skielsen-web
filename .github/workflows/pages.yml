name: SKIELSEN auf GitHub Pages bereitstellen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Dateien hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
