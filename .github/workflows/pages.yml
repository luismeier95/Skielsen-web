name: SKIELSEN deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Static Build und JavaScript prüfen
        run: python3 tools/verify.py

      - name: DNA Multiplayer Regressionen
        run: node --test tools/test_dna_sync.mjs

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Public-Verzeichnis hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: './public'

      - name: Website veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
