name: One-time V15.1.1 Buzzer test simulator

on:
  push:
    branches: [main]
    paths:
      - 'tools/release_v1511.py'
      - '.github/workflows/release-v1511-buzzer-test.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply release patch
        run: python3 tools/release_v1511.py

      - name: Validate
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/validate_static.py
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find public/assets/js -type f -name '*.js' -print0)
          grep -q 'mountTest' public/assets/js/09-buzzer-time.js
          grep -q 'renderBuzzerTest' public/assets/js/08-inapp-runtime.js
          grep -q 'SKIELSEN V15.1.1' public/index.html
          grep -q '"version": "15.1.1"' public/version.json

      - name: Commit release
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f tools/release_v1511.py .github/workflows/release-v1511-buzzer-test.yml
          git add -A
          git commit -m 'Add Buzzer simulator for test tournaments in V15.1.1'
          git push origin HEAD:main
