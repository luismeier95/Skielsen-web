name: Wortkette frequency audit
# rerun: frequency-threshold-pass-1

on:
  push:
    branches: [main]
    paths:
      - "tools/score_word_chain_frequency.py"
      - ".github/workflows/wortkette-frequency.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install wordfreq
        run: pip install "wordfreq==3.1.1"
      - name: Score Wortkette compounds
        run: python tools/score_word_chain_frequency.py
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/wortkette-frequency-audit.json
          if git diff --cached --quiet; then
            echo "No audit changes."
          else
            git commit -m "Update Wortkette frequency audit"
            git push
          fi
